{% extends "base.html" %}
{% block title %}Admin Control Center{% endblock %}
{% block content %}
<h4 class="mb-4">Admin Control Center</h4>
<div class="row g-3">
  <div class="col-md-4"><a href="{{ url_for('admin.users_list') }}" class="text-decoration-none">
    <div class="card"><div class="card-body"><i class="bi bi-person-badge fs-2" style="color:#0a4d2e;"></i><h6 class="mt-2">Users</h6><div class="text-muted small">Manage staff accounts</div></div></div>
  </a></div>
  <div class="col-md-4"><a href="{{ url_for('admin.roles_list') }}" class="text-decoration-none">
    <div class="card"><div class="card-body"><i class="bi bi-shield-lock fs-2" style="color:#0a4d2e;"></i><h6 class="mt-2">Roles &amp; Permissions</h6><div class="text-muted small">Configure access control</div></div></div>
  </a></div>
  <div class="col-md-4"><a href="{{ url_for('admin.departments_list') }}" class="text-decoration-none">
    <div class="card"><div class="card-body"><i class="bi bi-diagram-3 fs-2" style="color:#0a4d2e;"></i><h6 class="mt-2">Departments</h6><div class="text-muted small">Manage departments/sectors</div></div></div>
  </a></div>
  <div class="col-md-4"><a href="{{ url_for('admin.audit_log') }}" class="text-decoration-none">
    <div class="card"><div class="card-body"><i class="bi bi-journal-text fs-2" style="color:#0a4d2e;"></i><h6 class="mt-2">Audit Trail</h6><div class="text-muted small">Full system activity history</div></div></div>
  </a></div>
</div>
{% endblock %}
